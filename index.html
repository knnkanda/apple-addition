<!DOCTYPE html>
<html lang="ja">
<head>
<!-- version: v1.3 sound toggle, correct/wrong sounds, random celebration -->
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="description" content="りんごを1こずつ増やして学ぶ、答えが10までの足し算ゲーム。">
<title>りんごのたしざん</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff2d6;color:#473629;font-family:system-ui,sans-serif}main{max-width:540px;margin:auto;padding:20px 14px 40px}h1{text-align:center;color:#9c4d19;font-size:clamp(24px,6vw,32px)}.subtitle{text-align:center}.modes,.numbers{display:grid;gap:8px}.modes{grid-template-columns:repeat(3,1fr)}.numbers{grid-template-columns:repeat(5,1fr)}button{cursor:pointer;border:1px solid #ddd;border-radius:12px;background:white;padding:13px 6px;font-size:19px;font-weight:bold;touch-action:manipulation;min-height:48px;color:inherit}button:disabled{opacity:.5;cursor:default}button:focus-visible{outline:3px solid #237848;outline-offset:3px}button.selected{background:#ffce73;border:2px solid #b86b16}.primary{background:#f3a93c;color:#40250b;border:0;width:100%;margin-top:12px}.sound{display:block;width:100%;margin:12px 0 0;background:#fffaf0;border-color:#e0bd78;color:#6e4312}.sound[aria-pressed="true"]{background:#dff7e4;border-color:#50a56d;color:#235a34}.card{background:white;border-radius:18px;padding:18px;margin-top:18px}.status{display:flex;justify-content:space-between}.progress{height:10px;background:#e9d7b9;border-radius:10px;margin-top:14px;overflow:hidden}#bar{height:100%;background:#53a66b;width:0}.equation{text-align:center;font-size:38px;font-weight:bold;margin:18px 0}.apples{display:flex;flex-wrap:wrap;gap:5px;font-size:30px;min-height:44px}.apple{display:inline-block}.empty{opacity:.3}.hint{background:#f3f9ec;padding:12px;border-radius:12px}.hint p{font-size:14px}.feedback{text-align:center;padding:12px;border-radius:12px;margin-top:12px;background:#e5f6e8}.wrong{background:#fff0dd}.hidden{display:none}#result{text-align:center}small{display:block;text-align:center;margin-top:12px;font-size:13px}
#celebration{position:fixed;inset:0;pointer-events:none;overflow:hidden;z-index:10}.burst{position:absolute;left:var(--x);top:var(--y)}.spark{position:absolute;width:11px;height:11px;border-radius:999px;background:var(--color);box-shadow:0 0 16px var(--color);animation:fireworkSpark .9s ease-out forwards}.spark::after{content:"";display:block;width:5px;height:18px;border-radius:999px;background:inherit;transform:translate(3px,7px)}@keyframes fireworkSpark{0%{transform:translate(-50%,-50%) scale(.2);opacity:1}100%{transform:translate(var(--dx),var(--dy)) scale(.9);opacity:0}}.confetti{position:absolute;top:-30px;left:var(--x);font-size:28px;animation:confettiFall var(--duration) linear forwards}.paper{display:inline-block;transform:rotate(var(--rotate));animation:paperSpin .55s linear infinite}@keyframes confettiFall{0%{transform:translateY(-30px)}100%{transform:translateY(110vh)}}@keyframes paperSpin{to{transform:rotate(calc(var(--rotate) + 360deg))}}.cracker{position:absolute;bottom:22px;font-size:48px;animation:crackerJump 1s ease-out forwards}.cracker.left{left:16px;--flip:scaleX(1)}.cracker.right{right:16px;--flip:scaleX(-1)}@keyframes crackerJump{0%{transform:var(--flip) translateY(40px);opacity:0}25%{transform:var(--flip) translateY(0);opacity:1}100%{transform:var(--flip) translateY(10px);opacity:0}}.rocket{position:absolute;left:var(--x);bottom:-70px;font-size:54px;filter:drop-shadow(0 0 10px #ff8b1f);animation:rocketFly 1.35s cubic-bezier(.16,.84,.27,1) forwards}.rocket::after{content:"✨";position:absolute;left:12px;top:54px;font-size:28px;animation:trail .25s ease-in-out infinite alternate}.floating-star{position:absolute;left:var(--x);top:var(--y);font-size:26px;animation:starPop 1.2s ease-out forwards}@keyframes rocketFly{0%{transform:translateY(0) rotate(-12deg);opacity:0}10%{opacity:1}100%{transform:translateY(-112vh) rotate(10deg);opacity:0}}@keyframes trail{to{transform:translateY(18px) scale(1.3);opacity:.35}}@keyframes starPop{0%{transform:scale(.2) rotate(0);opacity:0}35%{opacity:1}100%{transform:translateY(-80px) scale(1.5) rotate(220deg);opacity:0}}@media (prefers-reduced-motion:reduce){#celebration *{animation-duration:.01ms!important}}
</style>
</head>
<body><main>
<h1>🍎 りんごの たしざん</h1>
<p class="subtitle">10までの かずで あそぼう！</p>
<div class="modes" aria-label="むずかしさ">
<button data-mode="easy" class="selected" aria-pressed="true">かんたん<small>＋1・＋2</small></button>
<button data-mode="medium" aria-pressed="false">ふつう<small>＋1〜4</small></button>
<button data-mode="hard" aria-pressed="false">ちょうせん<small>10まで</small></button>
</div>
<button id="soundToggle" class="sound" aria-pressed="false">🔇 サウンド オフ</button>
<section class="card">
<div class="status"><strong id="round"></strong><strong id="score"></strong></div>
<div class="progress"><div id="bar"></div></div>
<div id="game">
<p class="subtitle">ぜんぶで なんこ かな？</p>
<div id="equation" class="equation"></div>
<div id="hint" class="hint">
<p id="firstLabel"></p><div id="firstApples" class="apples"></div><hr>
<p id="secondLabel"></p><div id="secondApples" class="apples"></div>
<button id="add" class="primary">🍎 1こ ふやす</button>
</div>
<button id="showHint" class="hidden">🍎 りんごで かんがえる</button>
<p>こたえを えらんでね</p><div id="numbers" class="numbers"></div>
<div id="feedback" class="feedback hidden" role="status" aria-live="polite"></div>
<button id="check" class="primary">こたえあわせ ✓</button>
<button id="next" class="primary hidden">つぎの もんだい →</button>
</div>
<div id="result" class="hidden">
<h2>🎉 おしまい！</h2><h2 id="finalScore"></h2><p>さいごまで がんばったね！</p>
<button id="restart" class="primary">もう 10もん あそぶ</button>
</div>
</section>
<small>りんごを ふやして、こたえを タッチ！</small>
</main>
<div id="celebration" aria-hidden="true"></div>
<script>
let mode='easy',a=3,b=2,added=0,selected=null;
let round=1,score=0,solved=false,hintVisible=true;
let soundOn=false,audioContext=null;
const $=id=>document.getElementById(id);
const random=n=>Math.floor(Math.random()*n);
const colors=['#ff3b30','#ff9500','#ffcc00','#34c759','#32ade6','#5856d6','#ff2d55'];
function clearCelebration(){
  $('celebration').replaceChildren();
}
function burst(x,y,count=22){
  const base=document.createElement('div');
  base.className='burst';base.style.setProperty('--x',x+'%');base.style.setProperty('--y',y+'%');
  for(let i=0;i<count;i++){
    const spark=document.createElement('span');
    const angle=Math.PI*2*i/count;
    const distance=70+random(80);
    spark.className='spark';
    spark.style.setProperty('--dx',Math.cos(angle)*distance+'px');
    spark.style.setProperty('--dy',Math.sin(angle)*distance+'px');
    spark.style.setProperty('--color',colors[random(colors.length)]);
    base.append(spark);
  }
  $('celebration').append(base);
}
function fireworks(){
  clearCelebration();
  [20,50,80].forEach((x,i)=>setTimeout(()=>burst(x+random(9)-4,18+random(32),24),i*180));
  setTimeout(clearCelebration,1400);
}
function partyCrackers(){
  clearCelebration();
  ['left','right'].forEach(side=>{
    const cracker=document.createElement('div');
    cracker.className='cracker '+side;cracker.textContent='🎉';
    $('celebration').append(cracker);
  });
  const pieces=['🎊','✨','⭐','💛','💚','💙','❤️'];
  for(let i=0;i<70;i++){
    const confetti=document.createElement('span');
    const paper=document.createElement('span');
    confetti.className='confetti';
    confetti.style.setProperty('--x',random(100)+'%');
    confetti.style.setProperty('--duration',(1.25+Math.random()*1.25)+'s');
    confetti.style.setProperty('--rotate',random(360)+'deg');
    paper.className='paper';paper.textContent=pieces[random(pieces.length)];
    confetti.append(paper);
    $('celebration').append(confetti);
  }
  setTimeout(clearCelebration,2600);
}
function rocketShow(){
  clearCelebration();
  const rocket=document.createElement('div');
  const x=22+random(57);
  rocket.className='rocket';rocket.textContent='🚀';rocket.style.setProperty('--x',x+'%');
  $('celebration').append(rocket);
  for(let i=0;i<18;i++){
    setTimeout(()=>{
      const star=document.createElement('span');
      star.className='floating-star';star.textContent=['⭐','✨','🌟'][random(3)];
      star.style.setProperty('--x',(x+random(24)-12)+'%');
      star.style.setProperty('--y',(72-random(55))+'%');
      $('celebration').append(star);
    },i*55);
  }
  setTimeout(()=>burst(x,20+random(20),28),950);
  setTimeout(clearCelebration,2100);
}
function celebrateRandom(){
  [fireworks,partyCrackers,rocketShow][random(3)]();
}
function updateSoundButton(){
  $('soundToggle').textContent=soundOn?'🔊 サウンド オン':'🔇 サウンド オフ';
  $('soundToggle').setAttribute('aria-pressed',String(soundOn));
}
function getAudioContext(){
  const AudioContext=window.AudioContext||window.webkitAudioContext;
  if(!AudioContext)return null;
  if(!audioContext)audioContext=new AudioContext();
  if(audioContext.state==='suspended')audioContext.resume();
  return audioContext;
}
function playTone(frequency,start,duration,type='sine',volume=.12){
  const context=getAudioContext();
  if(!soundOn||!context)return;
  const oscillator=context.createOscillator();
  const gain=context.createGain();
  const now=context.currentTime+start;
  oscillator.type=type;oscillator.frequency.setValueAtTime(frequency,now);
  gain.gain.setValueAtTime(.001,now);
  gain.gain.exponentialRampToValueAtTime(volume,now+.03);
  gain.gain.exponentialRampToValueAtTime(.001,now+duration);
  oscillator.connect(gain);gain.connect(context.destination);
  oscillator.start(now);oscillator.stop(now+duration+.03);
}
function playCorrectSound(){
  playTone(880,0,.13,'sine',.13);
  playTone(1175,.16,.18,'sine',.14);
}
function playWrongSound(){
  playTone(180,0,.22,'sawtooth',.1);
  playTone(120,.12,.25,'sawtooth',.09);
}
function makeQuestion(){
  b=1+random(mode==='easy'?2:mode==='medium'?4:9);
  a=1+random(10-b);added=0;selected=null;solved=false;
  hintVisible=mode!=='hard';
  $('feedback').classList.add('hidden');render();
}
function render(){
  $('round').textContent=`もんだい ${round} / 10`;
  $('score').textContent=`⭐ ${score} てん`;
  $('bar').style.width=`${(round-1)*10}%`;
  $('equation').textContent=`${a} ＋ ${b} ＝ ${solved?a+b:'？'}`;
  $('hint').classList.toggle('hidden',!hintVisible);
  $('showHint').classList.toggle('hidden',hintVisible||solved);
  $('firstLabel').textContent=`さいしょに ${a}こ`;
  $('firstApples').textContent='🍎'.repeat(a);
  $('secondLabel').textContent=`あとから ${b}こ（いま ${added}こ）`;
  $('secondApples').replaceChildren();
  for(let i=0;i<b;i++){
    const span=document.createElement('span');
    span.className='apple'+(i>=added?' empty':'');
    span.textContent=i<added?'🍎':'○';$('secondApples').append(span);
  }
  $('add').disabled=added>=b||solved;
  $('add').textContent=added>=b?'ぜんぶ ふえたよ！':'🍎 1こ ふやす';
  $('numbers').replaceChildren();
  for(let i=1;i<=10;i++){
    const button=document.createElement('button');button.textContent=i;
    button.disabled=solved;button.classList.toggle('selected',selected===i);
    button.setAttribute('aria-pressed',String(selected===i));
    button.onclick=()=>{selected=i;$('feedback').classList.add('hidden');render();};
    $('numbers').append(button);
  }
  $('check').classList.toggle('hidden',solved);$('check').disabled=selected===null;
  $('next').classList.toggle('hidden',!solved);
  $('next').textContent=round===10?'けっかを みる':'つぎの もんだい →';
}
$('add').onclick=()=>{if(added<b&&!solved){added++;render();}};
$('showHint').onclick=()=>{hintVisible=true;render();};
$('check').onclick=()=>{
  if(selected===null||solved)return;
  const correct=selected===a+b;
  if(correct){solved=true;score++;added=b;}else{hintVisible=true;}
  render();
  $('feedback').textContent=correct?'🎉 せいかい！ よくできました！':'おしい！ もういちど かぞえてみよう。';
  $('feedback').classList.toggle('wrong',!correct);$('feedback').classList.remove('hidden');
  if(correct){playCorrectSound();celebrateRandom();}else{playWrongSound();}
};
$('next').onclick=()=>{
  if(!solved)return;
  if(round===10){
    $('game').classList.add('hidden');$('result').classList.remove('hidden');
    $('bar').style.width='100%';$('finalScore').textContent=`⭐ ${score}もん できたよ！`;
  }else{round++;makeQuestion();}
};
function restart(){round=1;score=0;$('game').classList.remove('hidden');$('result').classList.add('hidden');makeQuestion();}
document.querySelectorAll('[data-mode]').forEach(button=>{
  button.onclick=()=>{
    mode=button.dataset.mode;
    document.querySelectorAll('[data-mode]').forEach(x=>{
      x.classList.toggle('selected',x===button);x.setAttribute('aria-pressed',String(x===button));
    });restart();
  };
});
$('restart').onclick=restart;render();
$('soundToggle').onclick=()=>{
  soundOn=!soundOn;
  if(soundOn)getAudioContext();
  updateSoundButton();
};
updateSoundButton();
</script>
</body></html>
